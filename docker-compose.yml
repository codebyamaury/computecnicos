# ============================================
# Docker Compose - CompuTécnicos Project
# Servicios: App (PHP/Apache) + MySQL + phpMyAdmin
# ============================================
version: '3.8'

services:
  # ─── Aplicación PHP + Apache ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computecnicos-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-computecnicos}
      - DB_USER=${DB_USER:-computecnicos_user}
      - DB_PASS=${DB_PASS:-computecnicos_secret}
      # PayPal
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_ENVIRONMENT=${PAYPAL_ENVIRONMENT:-sandbox}
      # Facturación electrónica
      - FE_PROVIDER=${FE_PROVIDER:-alegra}
      - FE_SIMULATE=${FE_SIMULATE:-true}
      - ALEGRA_TOKEN=${ALEGRA_TOKEN:-}
      - ALEGRA_EMAIL=${ALEGRA_EMAIL:-}
      - SIIGO_CLIENT_ID=${SIIGO_CLIENT_ID:-}
      - SIIGO_CLIENT_SECRET=${SIIGO_CLIENT_SECRET:-}
      - SIIGO_USERNAME=${SIIGO_USERNAME:-}
      - SIIGO_PASSWORD=${SIIGO_PASSWORD:-}
    volumes:
      - uploads_data:/var/www/html/uploads
      - app_logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - computecnicos-net

  # ─── Base de datos MySQL ───
  db:
    image: mysql:8.0
    container_name: computecnicos-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-computecnicos}
      MYSQL_USER: ${DB_USER:-computecnicos_user}
      MYSQL_PASSWORD: ${DB_PASS:-computecnicos_secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/computecnicos_full.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - computecnicos-net

  # ─── phpMyAdmin (opcional, solo desarrollo) ───
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: computecnicos-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - computecnicos-net
    profiles:
      - dev

# ─── Volúmenes persistentes ───
volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  app_logs:
    driver: local

# ─── Red interna ───
networks:
  computecnicos-net:
    driver: bridge
