<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --adm-bg: #0e0e0e;
            --adm-card: rgba(18, 18, 20, 0.72);
            --adm-border: rgba(255, 255, 255, 0.07);
            --adm-red: #e00000;
            --adm-red-dark: #bb0000;
        }
        body {
            background: var(--adm-bg);
            color: #e7e7ea;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 2rem;
            margin: 0;
        }
        .adm-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.55rem 1.1rem;
            border-radius: 0.575rem;
            font-weight: 600;
            font-size: 0.82rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
        }
        .adm-pedido-filters {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 2.5rem;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02);
        }
        .adm-btn-todos { background: rgba(255, 255, 255, 0.04); color: #e2e2e2; border: 1px solid rgba(255, 255, 255, 0.08); }
        .adm-btn-todos.active { background: linear-gradient(135deg, #cc0000, #ff0000); color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.25); }
        .adm-btn-pendiente { background: rgba(234, 179, 8, 0.06); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.15); }
        .adm-btn-pagado { background: rgba(59, 130, 246, 0.06); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.15); }
        .adm-btn-preparacion { background: rgba(139, 92, 246, 0.06); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.15); }
        .adm-btn-enviado { background: rgba(6, 182, 212, 0.06); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.15); }
        .adm-btn-entregado { background: rgba(34, 197, 94, 0.06); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.15); }
        .adm-btn-cancelado { background: rgba(239, 68, 68, 0.06); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.15); }
        .adm-btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .adm-pedido-card {
            background: rgba(30, 30, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .adm-pedido-header { display: flex; justify-content: space-between; align-items: center; }
        .adm-pedido-id { font-weight: 700; font-size: 1.1rem; }
        .adm-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border: 1px solid; }
        .adm-badge-blue { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border-color: rgba(59, 130, 246, 0.2); }
        .adm-pedido-total { color: #ef4444; font-weight: 800; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div style="text-align:center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.5rem; opacity: 0.9;">Previsualización de Pedidos</h1>
    </div>

    <div class="adm-pedido-filters">
        <a href="#" class="adm-btn adm-btn-todos active">
            <i data-lucide="layers" style="width:16px;height:16px"></i>
            <span>Todos</span>
        </a>
        <a href="#" class="adm-btn adm-btn-pendiente">
            <i data-lucide="clock" style="width:16px;height:16px"></i>
            <span>Pendientes</span>
        </a>
        <a href="#" class="adm-btn adm-btn-pagado">
            <i data-lucide="credit-card" style="width:16px;height:16px"></i>
            <span>Pagados</span>
        </a>
        <a href="#" class="adm-btn adm-btn-preparacion">
            <i data-lucide="package" style="width:16px;height:16px"></i>
            <span>En preparación</span>
        </a>
        <a href="#" class="adm-btn adm-btn-enviado">
            <i data-lucide="truck" style="width:16px;height:16px"></i>
            <span>Enviados</span>
        </a>
        <a href="#" class="adm-btn adm-btn-entregado">
            <i data-lucide="check-circle" style="width:16px;height:16px"></i>
            <span>Entregados</span>
        </a>
        <a href="#" class="adm-btn adm-btn-cancelado">
            <i data-lucide="x-circle" style="width:16px;height:16px"></i>
            <span>Cancelados</span>
        </a>
    </div>

    <div class="adm-pedido-card">
        <div class="adm-pedido-header">
            <div>
                <span class="adm-pedido-id">Pedido #11</span>
                <span class="adm-badge adm-badge-blue">PAGADO</span>
                <span style="color:#555; font-size: 0.8rem; margin-left: 10px;">16/03/2026 15:45</span>
            </div>
            <div class="adm-pedido-total">$20.000 COP</div>
        </div>
        <div style="margin-top: 1rem; font-size: 0.85rem; color: #888;">
            👤 Amaury Mendoza &mdash; ama...@gmail.com | 📍 Ciudad Jardín...
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
